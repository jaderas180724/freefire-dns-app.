_format_version: "3.0"

services:
  - name: config-service
    url: http://config-service:3001
    routes:
      - name: config-api
        paths:
          - /api/v1/auth
          - /api/v1/projects
          - /api/v1/config
          - /api/v1/profiles
        strip_path: false

  - name: proxy-interceptor
    url: http://proxy-interceptor:8080
    routes:
      - name: proxy-route
        hosts:
          - "*.devflowlabs.io"
        strip_path: false

  - name: frontend
    url: http://frontend:3000
    routes:
      - name: frontend-route
        paths:
          - /
        strip_path: false

plugins:
  - name: rate-limiting
    config:
      minute: 60
      policy: local

  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
      headers:
        - Content-Type
        - Authorization
      credentials: true
