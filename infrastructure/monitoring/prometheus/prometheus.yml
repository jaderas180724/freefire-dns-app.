global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "config-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["config-service:3001"]
    scrape_interval: 10s

  - job_name: "proxy-interceptor"
    metrics_path: /metrics
    static_configs:
      - targets: ["proxy-interceptor:8080"]
    scrape_interval: 5s

  - job_name: "kong"
    metrics_path: /metrics
    static_configs:
      - targets: ["kong:8001"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
