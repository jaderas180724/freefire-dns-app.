apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: devflow-labs
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: devflow_grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: devflow-labs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: grafana-secret
          env:
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: devflow-labs
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
