apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-env
  namespace: devflow-labs
data:
  NEXT_PUBLIC_API_URL: https://api.devflowlabs.io
  NEXT_PUBLIC_APP_NAME: DevFlow Labs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devflow-labs
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: devflow-labs/frontend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: frontend-env
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: devflow-labs
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
