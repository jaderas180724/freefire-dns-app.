apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-interceptor-env
  namespace: devflow-labs
data:
  PROXY_PORT: "8080"
  CONFIG_SERVICE_URL: http://config-service:3001
  REDIS_URL: redis://redis:6379
  PROXY_DOMAIN: devflowlabs.io
  CACHE_TTL_SECONDS: "30"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-interceptor
  namespace: devflow-labs
  labels:
    app: proxy-interceptor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: proxy-interceptor
  template:
    metadata:
      labels:
        app: proxy-interceptor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: proxy-interceptor
          image: devflow-labs/proxy-interceptor:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: proxy-interceptor-env
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-interceptor
  namespace: devflow-labs
spec:
  selector:
    app: proxy-interceptor
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: proxy-interceptor-hpa
  namespace: devflow-labs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: proxy-interceptor
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
