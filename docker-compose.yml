version: "3.9"

services:
  # ─── PostgreSQL Database ───
  postgres:
    image: postgres:16-alpine
    container_name: devflow-postgres
    environment:
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: devflow_secret
      POSTGRES_DB: devflow_labs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/config-service/src/models/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devflow-network

  # ─── Redis Cache ───
  redis:
    image: redis:7-alpine
    container_name: devflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devflow-network

  # ─── Config Management Service (Node.js/TypeScript) ───
  config-service:
    build:
      context: ./services/config-service
      dockerfile: Dockerfile
    container_name: devflow-config-service
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://devflow:devflow_secret@postgres:5432/devflow_labs
      REDIS_URL: redis://redis:6379
      JWT_SECRET: devflow-jwt-secret-change-in-production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devflow-network

  # ─── Proxy Interceptor Service (Go) ───
  proxy-interceptor:
    build:
      context: ./services/proxy-interceptor
      dockerfile: Dockerfile
    container_name: devflow-proxy-interceptor
    environment:
      CONFIG_SERVICE_URL: http://config-service:3001
      PROXY_PORT: 8080
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      - config-service
      - redis
    networks:
      - devflow-network

  # ─── Frontend (Next.js) ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devflow-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_NAME: DevFlow Labs
    ports:
      - "3000:3000"
    depends_on:
      - config-service
    networks:
      - devflow-network

  # ─── Kong API Gateway ───
  kong-database:
    image: postgres:16-alpine
    container_name: devflow-kong-db
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong_secret
      POSTGRES_DB: kong
    volumes:
      - kong_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devflow-network

  kong-migration:
    image: kong:3.6
    container_name: devflow-kong-migration
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_secret
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - devflow-network

  kong:
    image: kong:3.6
    container_name: devflow-kong
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_secret
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - devflow-network

  # ─── Prometheus ───
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: devflow-prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - devflow-network

  # ─── Grafana ───
  grafana:
    image: grafana/grafana:10.4.0
    container_name: devflow-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: devflow_grafana
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    networks:
      - devflow-network

  # ─── Loki (Log Aggregation) ───
  loki:
    image: grafana/loki:2.9.5
    container_name: devflow-loki
    volumes:
      - ./infrastructure/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - devflow-network

volumes:
  postgres_data:
  redis_data:
  kong_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  devflow-network:
    driver: bridge
