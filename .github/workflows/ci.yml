name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ─── Config Service ───
  config-service:
    name: Config Service - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/config-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/config-service/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # ─── Proxy Interceptor ───
  proxy-interceptor:
    name: Proxy Interceptor - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/proxy-interceptor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/proxy-interceptor/go.sum

      - run: go mod download
      - run: go vet ./...
      - run: go test -v -race ./...
      - run: CGO_ENABLED=0 go build -o /dev/null ./cmd/proxy/main.go

  # ─── Frontend ───
  frontend:
    name: Frontend - Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # ─── Docker Build ───
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [config-service, proxy-interceptor, frontend]
    if: github.event_name == 'push'

    strategy:
      matrix:
        service:
          - name: config-service
            context: ./services/config-service
          - name: proxy-interceptor
            context: ./services/proxy-interceptor
          - name: frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Kubernetes Validation ───
  k8s-validate:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install kubeval
        run: |
          wget -q https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin/

      - name: Validate manifests
        run: |
          find infrastructure/kubernetes -name '*.yaml' -print0 | \
            xargs -0 kubeval --strict --ignore-missing-schemas || true
